name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 每天 03:00 UTC（北京 11:00）跑一遍全量。目的是捕捉 **runner 工具链漂移**：
    # Xcode / Swift / JDK / Node 升级后构建坏掉，只在下次 push 才暴露就太晚了。
    - cron: '0 3 * * *'

# 最小权限：CI 只读仓库。需要写权限的 job 就地提权（见 release-mac.yml）。
permissions:
  contents: read

# 同一个 PR 的新 push 取消上一次运行；main / 手动 / 定时运行**不取消**，
# 免得把基线运行打断（与 Lody 的做法一致）。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'

jobs:
  swift:
    name: Swift core · build + tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Swift version
        run: swift --version
      - name: Build (all targets)
        run: swift build
      - name: Unit tests
        run: swift test

  apple-targets:
    name: iOS + watchOS · compile only
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode
        # 第三方 Action 固定到完整 commit SHA（版本写在注释里，Dependabot 会跟着更新）
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: Build iOS app (no signing)
        run: |
          xcodebuild -project ios/BrewPing.xcodeproj \
            -scheme BrewPing \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build
      - name: Build watchOS app (no signing)
        run: |
          xcodebuild -project ios/BrewPing.xcodeproj \
            -scheme 'BrewPing Watch App' \
            -destination 'generic/platform=watchOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build

  windows:
    name: Windows desktop · Rust tests + typecheck
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Sources/BrewPingwinDesktop/package-lock.json
      - name: Install frontend dependencies
        working-directory: Sources/BrewPingwinDesktop
        run: npm ci
      - name: Typecheck frontend
        working-directory: Sources/BrewPingwinDesktop
        run: npx tsc
      - name: Rust tests
        working-directory: Sources/BrewPingwinDesktop/src-tauri
        run: cargo test --locked

  android:
    name: Android · assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build debug APK
        working-directory: Android
        run: ./gradlew assembleDebug --no-daemon

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: LICENSE is present
        run: |
          test -f LICENSE || { echo "::error::LICENSE file is missing"; exit 1; }
      - name: No build artifacts are tracked
        run: |
          if git ls-files | grep -qE '(^|/)(build[^/]*|dist|node_modules|DerivedData|target)/|\.app/|\.xcarchive'; then
            echo "::error::Compiled artifacts or dependency directories are tracked by git:"
            git ls-files | grep -E '(^|/)(build[^/]*|dist|node_modules|DerivedData|target)/|\.app/|\.xcarchive' | head -20
            exit 1
          fi
      - name: README exists in both languages
        run: |
          test -f README.md && test -f README.zh-CN.md || { echo "::error::README.md / README.zh-CN.md missing"; exit 1; }
