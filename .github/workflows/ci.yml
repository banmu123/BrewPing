name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 每天 03:00 UTC（北京 11:00）跑一遍全量。目的是捕捉 **runner 工具链漂移**：
    # Xcode / Swift / JDK / Node 升级后构建坏掉，只在下次 push 才暴露就太晚了。
    - cron: '0 3 * * *'

# 最小权限：CI 只读仓库。需要写权限的 job 就地提权（见 release-mac.yml）。
permissions:
  contents: read

# 同一个 PR 的新 push 取消上一次运行；main / 手动 / 定时运行**不取消**，
# 免得把基线运行打断（与 Lody 的做法一致）。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'

jobs:
  swift:
    name: Swift core · build + tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Swift version
        run: swift --version
      - name: Build (all targets)
        run: swift build
      - name: Unit tests
        run: swift test

  apple-targets:
    name: iOS + watchOS · compile only
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select Xcode
        # 第三方 Action 固定到完整 commit SHA（版本写在注释里，Dependabot 会跟着更新）
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: Build iOS app (no signing)
        run: |
          xcodebuild -project ios/BrewPing.xcodeproj \
            -scheme BrewPing \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build
      - name: Build watchOS app (no signing)
        run: |
          xcodebuild -project ios/BrewPing.xcodeproj \
            -scheme 'BrewPing Watch App' \
            -destination 'generic/platform=watchOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build

  windows:
    name: Windows desktop · Rust tests + typecheck
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Sources/BrewPingwinDesktop/package-lock.json
      - name: Install frontend dependencies
        working-directory: Sources/BrewPingwinDesktop
        run: npm ci
      - name: Typecheck frontend
        working-directory: Sources/BrewPingwinDesktop
        run: npx tsc
      - name: Build frontend
        # 🚨 必须构建：cargo test 编译 lib 时会展开 tauri::generate_context!()，
        # 而 tauri.conf.json 的 frontendDist=../dist 必须真实存在 —— dist/ 不入库
        # （gitignore），之前 CI 只 typecheck 不 build，于是 proc macro 直接 panic：
        #   error: proc macro panicked
        #   = help: message: The `frontendDist` ... path doesn't exist
        working-directory: Sources/BrewPingwinDesktop
        run: npx vite build
      - name: Rust tests
        working-directory: Sources/BrewPingwinDesktop/src-tauri
        # Windows runner 默认 shell 是 PowerShell，这里要 PIPESTATUS 与 tee，
        # 所以显式用 bash（windows-latest 自带 Git Bash）。
        shell: bash
        run: |
          # 与 android job 同样的理由：runner 的 job 日志要 admin 才能下载，
          # 所以把失败原因提炼成 ::error 注解（注解可经公开 API 匿名读取）。
          set +e
          cargo test --locked --no-fail-fast 2>&1 | tee /tmp/cargo.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            # 抓断言上下文（-B2 -A10）：cargo 的 assert_eq! 会把 left / right 实际值
            # 打在 panic 行之后的几行里，只 grep panic 那一行等于看不到「差在哪」。
            reason=$(grep -B 2 -A 10 -E 'panicked at|test result: FAILED|^error(\[|:)|failures:' /tmp/cargo.log \
                     | grep -vE '^[[:space:]]*$' | head -16 | tr '\n' '~' | cut -c1-900)
            echo "::error title=cargo test failed (exit $status)::${reason:-no matching error line captured}"
            exit "$status"
          fi

  android:
    name: Android · unit tests + phone/Wear builds
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Ensure Android SDK Platform 36
        # compileSdk=36 需要 platforms;android-36。runner 镜像预装的 SDK 平台集合
        # 会随镜像版本漂移，缺了 AGP 不会降级，而是直接失败。本机实测的报错原文：
        #   Could not determine the dependencies of task ':app:compileDebugJavaWithJavac'.
        #   > Failed to install the following SDK components:
        #         platforms;android-36 Android SDK Platform 36
        # （AGP 会尝试自动下载，但下载中断时会停在 "Error on ZipFile unknown archive"）
        # 本步是幂等的：已安装时 sdkmanager 直接返回。
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ -d "$SDK_DIR/platforms/android-36" ]; then
            echo "platforms;android-36 already present"
          else
            echo "installing platforms;android-36 ..."
            # yes 用于兜底回答 license 询问（runner 通常已预接受，此时 yes 收 SIGPIPE，无害）
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" \
              "platforms;android-36" "build-tools;36.0.0" \
              || echo "::warning title=SDK 36 install failed::sdkmanager 未能安装，交由后续构建步骤暴露真实错误"
          fi
          echo "---- platforms ----"
          ls "$SDK_DIR/platforms" 2>/dev/null || true
          echo "---- build-tools ----"
          ls "$SDK_DIR/build-tools" 2>/dev/null || true
      - name: Build debug APK
        working-directory: Android
        run: |
          # 兜底：git 里的可执行位可能被 Windows 端提交打回 644（core.filemode=false），
          # 那样 ./gradlew 在 Linux runner 上直接 Permission denied。
          chmod +x gradlew

          # ---- 环境自检 ----------------------------------------------------
          # 首次上线时本 job 在 5 秒内就失败（Gradle 根本没启动），而 runner 的
          # job 日志需要登录才能下载（API 要 admin 权限）。所以这里把关键环境
          # 信息打印出来，并把失败原因提炼成 ::error 注解 —— **注解可以用公开的
          # check-runs API 匿名读取**，排查时不用等人贴日志。
          echo "---- java ----"
          which java || echo "(java not on PATH)"
          java -version 2>&1 | head -2 || true
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}  ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          echo "---- wrapper ----"
          grep -h '^distributionUrl' gradle/wrapper/gradle-wrapper.properties
          ls -l gradlew gradle/wrapper/gradle-wrapper.jar
          head -1 gradlew
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          [ -d "$SDK_DIR" ] || echo "::warning title=Android SDK missing::no SDK directory at $SDK_DIR"

          # ---- 测试 + 构建 -------------------------------------------------
          # test：:core + :app 的 JVM 单测（83 例，无需设备/模拟器）
          # assembleDebug：手机端 APK；:wear:assembleDebug：Wear OS 模块
          set +e
          ./gradlew test assembleDebug :wear:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            reason=$(grep -m 4 -iE 'what went wrong|caused by:|sdk location|permission denied|not found|unsupported|no such file|failed to' /tmp/gradle.log | head -4 | tr '\n' '~' | cut -c1-700)
            echo "::error title=Gradle test/assemble failed (exit $status)::${reason:-no matching error line captured}"
            exit "$status"
          fi

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: LICENSE is present
        run: |
          test -f LICENSE || { echo "::error::LICENSE file is missing"; exit 1; }
      - name: No build artifacts are tracked
        run: |
          if git ls-files | grep -qE '(^|/)(build[^/]*|dist|node_modules|DerivedData|target)/|\.app/|\.xcarchive'; then
            echo "::error::Compiled artifacts or dependency directories are tracked by git:"
            git ls-files | grep -E '(^|/)(build[^/]*|dist|node_modules|DerivedData|target)/|\.app/|\.xcarchive' | head -20
            exit 1
          fi
      - name: README exists in both languages
        run: |
          test -f README.md && test -f README.zh-CN.md || { echo "::error::README.md / README.zh-CN.md missing"; exit 1; }
      - name: LICENSE is a plain MIT text
        # GitHub 的 license 识别要求 LICENSE 是**标准文本**：在 MIT 正文后面追加
        # 任何段落（例如商标声明）都会让仓库元数据识别不出来。商标说明在
        # TRADEMARKS.md，这里守住回归。
        run: |
          first_line=$(head -1 LICENSE | tr -d '\r')
          [ "$first_line" = "MIT License" ] || { echo "::error::LICENSE must start with 'MIT License', got: $first_line"; exit 1; }
          grep -q "Permission is hereby granted, free of charge" LICENSE || { echo "::error::LICENSE body is not the standard MIT text"; exit 1; }
          if grep -qi "trademark" LICENSE; then
            echo "::error::Trademarks belong in TRADEMARKS.md, not appended to LICENSE (it breaks GitHub license detection)"
            exit 1
          fi
          test -f TRADEMARKS.md || { echo "::error::TRADEMARKS.md is missing"; exit 1; }
