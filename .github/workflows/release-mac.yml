name: Release macOS

# 打 tag 就自动出包：git tag v1.0.0 && git push origin v1.0.0
# 也可以手动触发（Actions → Run workflow），用于不建 tag 的临时构建。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 1.0.0）；留空则用 git describe"
        required: false
        default: ""
      skip_notarize:
        description: "跳过公证（只签名，用于自测）"
        type: boolean
        default: false

# 最小权限：整个 workflow 默认只读，只有需要建 Release 的 job 就地提权。
permissions:
  contents: read

# 发布流**永不被取消**：中途打断会留下半上传的 Release / 未 staple 的产物。
concurrency:
  group: release-mac
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write   # 只为创建 GitHub Release 提权

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整历史，git describe 才能算出版本号
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: brewping-ci
        run: |
          CERT_PATH="$RUNNER_TEMP/brewping-cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/brewping-signing.keychain-db"

          echo -n "$MACOS_CERTIFICATE" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          # 少了这步 codesign 会在 CI 上弹不出授权而失败（常见坑）。
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          rm -f "$CERT_PATH"

      - name: Build, sign, notarize, package
        env:
          VERSION: ${{ github.event.inputs.version || '' }}
          BUILD: ${{ github.run_number }}
          # 证书全名，形如 "Developer ID Application: Your Name (TEAMID1234)"
          CERT: ${{ secrets.MACOS_CERT_NAME }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          SKIP_NOTARIZE: ${{ github.event.inputs.skip_notarize && '1' || '0' }}
        run: |
          chmod +x Scripts/build-mac-app.sh
          ./Scripts/build-mac-app.sh

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.dmg
            dist/*.dmg.sha256
          generate_release_notes: true

      - name: Upload artifacts (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: BrewPing-macOS
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
