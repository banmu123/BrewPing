[package]
name = "brewping-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "brewping_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
mdns-sd = "0.13"
uuid = { version = "1", features = ["v4"] }
hostname = "0.4"
chrono = { version = "0.4", features = ["serde"] }
local-ip-address = "0.6"
which = "8"
dirs = "6"
dunce = "1.0"
log = "0.4"
env_logger = "0.11"
# Node 版本清单（nodejs.org dist index）与 NVM 官方安装包下载：
# 只需要阻塞式 GET + TLS（rustls），ureq 比 reqwest 轻一个量级
ureq = { version = "2", default-features = false, features = ["tls"] }
# 模型转发代理（model_proxy）的上游请求：异步 + 流式（SSE 透传）。
# 不开 gzip/brotli feature —— 压缩语义必须原样透传，reqwest 不得代解压。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
# model_transform 的 SSE 流转换（unfold + StreamExt）与字节分块
futures = "0.3"
bytes = "1"
# cli_takeover 写 Codex config.toml（保注释保格式的编辑式写入）
toml_edit = "0.22"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_WindowsProgramming",
    # 单实例守卫（services/single_instance.rs）：
    #   Win32_Security             -> CreateMutexW 的 SECURITY_ATTRIBUTES 形参类型
    #   Win32_System_Threading     -> CreateMutexW
    #   Win32_UI_WindowsAndMessaging -> FindWindowW / ShowWindow / SetForegroundWindow
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
